<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>SafeMe | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.17.2/dist/sweetalert2.all.min.js"></script>

    <!-- App favicon -->
    <link rel="shortcut icon" href="assets/images/favicon.png">

    <!-- App css -->
    <link href="assets/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <link href="assets/css/icons.min.css" rel="stylesheet" type="text/css" />
    <link href="assets/css/app.min.css" rel="stylesheet" type="text/css" />
    <link href="assets/css/safeme-admin-theme.css?v=20260723loginfit" rel="stylesheet" type="text/css"/>

</head>

<body class="account-body accountbg safeme-login-page">

<!-- Log In page -->
<div class="safeme-login-shell">
    <div class="safeme-login-card-wrap">
        <div class="card safeme-login-card">
            <div class="card-body p-0 auth-header-box">
                <div class="text-center safeme-login-header">
                    <a href="index.html" class="logo logo-admin">
                        <img src="assets/images/logo-sm.png" alt="SafeMe logo" class="auth-logo safeme-login-logo">
                    </a>
                    <h4 class="mt-2 mb-1 fw-semibold text-white safeme-login-title">SafeMe Police Admin</h4>
                    <p class="text-muted mb-0 safeme-login-subtitle">Sign in with your admin credentials</p>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="tab-content">
                    <div class="tab-pane active safeme-login-pane" id="LogIn_Tab" role="tabpanel">
                        <form class="form-horizontal auth-form" onsubmit="event.preventDefault(); validate();">
                            <div class="form-group mb-3">
                                <label class="form-label" for="email">Email</label>
                                <div class="input-group">
                                    <input type="email" class="form-control" name="email" id="email" placeholder="Email" autocomplete="username" value="">
                                </div>
                            </div>
                            <div class="form-group mb-3">
                                <label class="form-label" for="password">Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" name="password" id="password" placeholder="Password" autocomplete="current-password" value="">
                                </div>
                            </div>
                            <div class="form-group mb-0">
                                <button class="btn btn-primary w-100 waves-effect waves-light" onclick="validate()" type="button">Log In <i class="fas fa-sign-in-alt ms-1"></i></button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="card-body bg-light-alt text-center safeme-login-footer">
                <span class="text-muted">SafeMe © <script>document.write(new Date().getFullYear())</script></span>
            </div>
        </div>
    </div>
</div>
<!-- End Log In page -->

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-database-compat.js"></script>
<script src="firebase-JS/firebase-config.js?v=20250604"></script>
<script src="firebase-JS/firebase-config.local.js"></script>
<script src="firebase-JS/firebase.js"></script>
<script src="firebase-JS/index.js?v=20250604"></script>

<!-- jQuery  -->
<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/waves.js"></script>
<script src="assets/js/feather.min.js"></script>
<script src="assets/js/simplebar.min.js"></script>
</body>
</html>
