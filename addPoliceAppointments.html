                <div class="col-lg-12">
                    <div class="card">
                        <div class="card-header">
                            <div class="row">
                                <div class="col-lg-12 ">
                                    <h4 class="card-title">Please fill all the fields</h4>
                                </div>
                            </div>

                        </div><!--end card-header-->
                        <div class="card-body">
                            <div class="row">
                                <div class="col-lg-6">
                                    <div class="mb-3 row">
                                        <label class="col-sm-2 form-label align-self-center mb-lg-0 text-end">AID</label>
                                        <div class="col-sm-10">
                                            <h6 id="last-aid"></h6>
                                        </div>
                                    </div>
                                    <div class="mb-3 row">
                                        <label class="col-sm-2 form-label align-self-center mb-lg-0 text-end">NIC</label>
                                        <div class="col-sm-10">
                                            <input class="form-control" type="text" value="" id="nic">
                                        </div>
                                    </div>
                                    <div class="mb-3 row">
                                        <label class="col-sm-2 form-label align-self-center mb-lg-0 text-end">Telephone</label>
                                        <div class="col-sm-10">
                                            <input class="form-control" type="number" onkeydown="limit(this);" onkeyup="limit(this);" value="" id="telephone">
                                        </div>
                                    </div>
                                    <div class="mb-3 row">
                                        <label class="col-sm-2 form-label align-self-center mb-lg-0 text-end">Schedule Date</label>
                                        <div class="col-sm-10">
                                            <input class="form-control" type="date" id="date">
                                            <script>
                                                document.getElementById('pub-sheduled-date').value = new Date().toISOString().substring(0, 10);
                                                var today = new Date();
                                                var dd = String(today.getDate()).padStart(2, '0');
                                                var mm = String(today.getMonth() + 1).padStart(2, '0');
                                                var yyyy = today.getFullYear();

                                                today = yyyy + '-' + mm + '-' + dd;
                                                $('#pub-sheduled-date').attr('min',today);
                                            </script>
                                        </div>
                                    </div>

                                </div>


                                <div class="col-lg-6">
                                    <div class="mb-3 row">
                                        <label class="col-sm-2 form-label align-self-center mb-lg-0 text-end">Email</label>
                                        <div class="col-sm-10">
                                            <input class="form-control" type="email" value="" id="email">
                                        </div>
                                    </div>
                                    <div class="mb-3 row">
                                        <label class="col-sm-2 form-label align-self-center mb-lg-0 text-end">City</label>
                                        <div class="col-sm-10">
                                            <input class="form-control" type="text" value="" id="city">
                                        </div>
                                    </div>
                                    <div class="mb-3 row">
                                        <label class="col-sm-2 form-label align-self-center mb-lg-0 text-end">Type</label>
                                        <div class="col-sm-10">
                                            <select class="form-select" id="type" aria-label="Default select example">
                                                <option selected disabled value="0">Please select type</option>
                                                <option value="Crimes Against Women & Children">Crimes Against Women & Children</option>
                                                <option value="Minor Crimes (Less than 50000)">Minor Crimes (Less than 50000)</option>
                                                <option value="Minor Complaints">Minor Complaints</option>
                                                <option value="Traffic Violation">Traffic Violation</option>
                                                <option value="Lost & Found">Lost & Found</option>
                                                <option value="Crime">Crime</option>
                                                <option value="Murder">Murder</option>
                                                <option value="Other">Other</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-sm-12 text-end">
                                            <button type="submit" onclick="add()" class="btn btn-primary px-4">Add</button>
                                        </div>
                                    </div>

                                </div>
                            </div>
